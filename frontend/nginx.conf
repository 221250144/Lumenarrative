server {
    listen 80;
    server_name localhost;
    client_max_body_size 260m;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
