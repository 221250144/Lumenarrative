name: xuguangji
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://xuguangji:xuguangji_local@db:5432/xuguangji
    REDIS_URL: redis://redis:6379/0
    QUEUE_MODE: celery
    DB_POOL_SIZE: ${DB_POOL_SIZE:-2}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
    DATA_DIR: /app/data
    MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    VLM_MODEL: ${VLM_MODEL:-qwen3.8-max}
    LLM_MODEL: ${LLM_MODEL:-qwen-plus}
    MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-180}
    MODEL_CONCURRENCY: ${MODEL_CONCURRENCY:-8}
    MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-2}
    FFMPEG_THREADS: ${FFMPEG_THREADS:-4}
    VIDEO_GENERATION_ENABLED: ${VIDEO_GENERATION_ENABLED:-true}
    VIDEO_GENERATION_MODEL: ${VIDEO_GENERATION_MODEL:-happyhorse-1.1-i2v}
    VIDEO_GENERATION_BASE_URL: ${VIDEO_GENERATION_BASE_URL:-}
    VIDEO_GENERATION_CONCURRENCY: ${VIDEO_GENERATION_CONCURRENCY:-1}
    VIDEO_GENERATION_POLL_S: ${VIDEO_GENERATION_POLL_S:-15}
    VIDEO_GENERATION_TIMEOUT_S: ${VIDEO_GENERATION_TIMEOUT_S:-900}
    ASR_BASE_URL: ${ASR_BASE_URL:-}
    ASR_API_KEY: ${ASR_API_KEY:-}
    ASR_MODEL: ${ASR_MODEL:-}
  volumes:
    - media:/app/data
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xuguangji
      POSTGRES_USER: xuguangji
      POSTGRES_PASSWORD: xuguangji_local
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xuguangji"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *backend
    cpus: 8.0
    command: [celery, -A, app.workers.queue.celery_app, worker, --loglevel=INFO, "--concurrency=${WORKER_CONCURRENCY:-8}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      - api
volumes:
  media:
  postgres:
  redis:
